<style>
/* ═══════════ Toán Lớp 2 · giao diện ═══════════ */
:root {
  --bg: #f6f4ff;
  --ink: #221d4d;
  --ink-soft: #544e7a;
  --muted: #8b86aa;
  --card: #ffffff;
  --line: #e9e5fb;
  --primary: #6c5ce7;

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {

  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(180deg, #f7f5ff 0%, #f2f1ff 45%, #eef5ff 100%);

  overflow-x: hidden;
}

[hidden] { display: none !important; }

button { font-family: inherit; }

.blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
.b1 { width: 420px; height: 420px; background: #d9d2ff; top: -140px; left: -120px; }
.b2 { width: 380px; height: 380px; background: #ffe2c7; top: 30%; right: -160px; }
.b3 { width: 360px; height: 360px; background: #d6f4f4; bottom: -160px; left: 20%; }

/* ─────────── thanh trên ─────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px clamp(16px, 4vw, 40px);

}

.brand {

  gap: 10px;

  background: transparent;
  padding: 4px;
  border-radius: 16px;
  cursor: pointer;
  color: inherit;
}
.brand:hover { background: var(--primary-soft); }
.brand-mark {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  font-size: 22px;
  border-radius: 14px;

}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }

.top-actions { display: flex; align-items: center; gap: 10px; }

  gap: 6px;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 999px;
  background: #fff8e6;
  color: #9a6b00;
  border: 1px solid #ffe9b3;
}
.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.icon-btn:hover { background: var(--primary-soft); }
.icon-btn:active { transform: scale(0.94); }

/* ─────────── khung chung ─────────── */
.wrap {
  position: relative;
  z-index: 1;
  width: min(1040px, 100%);
  margin: 0 auto;
  padding: clamp(18px, 3vw, 34px) clamp(16px, 4vw, 32px) 64px;
}

.screen { display: none; animation: rise 0.32s ease both; }

h2 { font-size: clamp(1.15rem, 2.4vw, 1.4rem); }
p { margin: 0; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(18px, 3vw, 26px);
}

.muted { color: var(--muted); }

.lede { margin-top: 10px; color: var(--ink-soft); font-size: 1rem; max-width: 48ch; line-height: 1.55; }

.hero-art { display: grid; grid-template-columns: repeat(2, auto); gap: 10px; padding: 4px; }
.ha {

  place-items: center;
  width: clamp(52px, 9vw, 72px);

.level-card { margin-bottom: 22px; }

.level-chip:hover { transform: translateY(-2px); }
.level-chip.is-active { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 4px 0 rgba(108, 92, 231, 0.15); }
.lvl-icon { font-size: 18px; line-height: 1; }
.lvl-label { font-weight: 800; font-size: 1rem; }
.lvl-note { font-size: 0.76rem; color: var(--muted); line-height: 1.3; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 4px 12px;
}
.link-btn {
  border: 0;
  background: transparent;
  color: var(--primary);
  font-weight: 800;
  font-size: 0.92rem;
  cursor: pointer;
  padding: 8px 10px;
  border-radius: 12px;
}
.link-btn:hover { background: var(--primary-soft); }

.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

/* ─────────── thẻ chủ đề ─────────── */

.tone-orange { --tone: #f08c2e; --tone-soft: #fff2e2; }
.tone-pink { --tone: #ec4f83; --tone-soft: #ffe9f0; }
.tone-teal { --tone: #0d9a9a; --tone-soft: #e2f7f7; }
.tone-blue { --tone: #2f7fe8; --tone-soft: #e7f1ff; }
.tone-violet { --tone: #8250e6; --tone-soft: #f1eaff; }
.tone-green { --tone: #1faa59; --tone-soft: #e7f9ef; }
.tone-rainbow { --tone: #f0682f; --tone-soft: #fff1e6; }

.topic-card {

.topic-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.topic-name { font-weight: 800; font-size: 1.02rem; color: var(--ink); }
.topic-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
.topic-stars { font-size: 0.82rem; letter-spacing: 0.12em; color: #f4a11c; }

/* ─────────── luyện tập ─────────── */

}

}
.ghost-btn:hover { background: var(--primary-soft); color: var(--primary-dark); }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.choice {

}
.choice:hover { border-color: #c9bffa; background: #fff; transform: translateY(-2px); }

.choice.is-wrong { border-color: var(--red); background: var(--red-soft); color: #a92d29; }
.choices.is-locked .choice { cursor: default; transform: none; }

.answer-display {
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  border: 2px dashed #cfc6f8;
  background: #faf9ff;
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--ink);
}
.answer-display .placeholder { font-size: 0.95rem; font-weight: 700; letter-spacing: 0; color: var(--muted); }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {

  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--ink);
  cursor: pointer;
  box-shadow: 0 3px 0 #ece8fb;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
}
.key:hover { background: #f8f6ff; }

.answer-actions { display: flex; gap: 10px; }
.answer-actions .btn { flex: 1; }

.btn {

  padding: 12px 20px;
  border: 0;
  border-radius: 18px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
.btn-primary:not(:disabled):hover { background: #7a6bf0; }
.btn-primary:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn-ghost { color: var(--primary-dark); background: var(--primary-soft); box-shadow: 0 4px 0 #ddd5ff; }

  border-radius: 16px;
  background: #fff8e6;
  border: 1px solid #ffe6ab;
  color: #8a5f00;
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.45;
}

/* ─────────── phản hồi ─────────── */
.feedback {

}
.feedback.is-wrong { border-color: #f3c2c0; background: linear-gradient(180deg, #fff6f6, #fdecec); }

.feedback.is-wrong .feedback-head { color: #b7342f; }
.feedback-answer { margin-top: 8px; font-weight: 800; color: var(--ink); }
.feedback-explain { margin-top: 6px; color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; white-space: pre-line; }
.feedback .btn { margin-top: 14px; width: 100%; }

/* ─────────── kết quả ─────────── */
.result-card { text-align: center; max-width: 620px; margin: 8px auto 0; }
.result-stars { display: flex; justify-content: center; gap: 8px; font-size: clamp(2.2rem, 7vw, 3rem); line-height: 1; margin-bottom: 10px; }

.result-stars span.off { filter: grayscale(1); opacity: 0.28; }
@keyframes pop { from { transform: scale(0.2) rotate(-18deg); opacity: 0; } to { transform: none; opacity: 1; } }
.result-sub { margin-top: 8px; color: var(--ink-soft); font-size: 1rem; }

.result-review li { background: #fff8f7; border: 1px solid #f6dfdd; border-radius: 14px; padding: 10px 12px; }
.rv-q { font-weight: 700; font-size: 0.9rem; line-height: 1.4; white-space: pre-line; }
.rv-a { margin-top: 4px; font-size: 0.85rem; color: #a83b36; font-weight: 700; }
.result-actions { display: flex; flex-direction: column; gap: 10px; }

.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.mini-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; box-shadow: 0 10px 24px -24px rgba(47, 34, 110, 0.9); }

.mini-card li { font-size: 0.9rem; font-weight: 600; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }

.fact-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fact-list li { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 0.92rem; color: var(--ink-soft); }
.fact-list li b { color: var(--ink); }
.hand-danger { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: #fff; border: 1px dashed #f0c9c7; border-radius: 18px; padding: 14px 16px; }

.danger-btn { border: 1px solid #f0c9c7; background: #fff6f5; color: #b7342f; font-weight: 800; border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 0.85rem; }

/* ─────────── màn hình nhỏ ─────────── */

@media (prefers-reduced-motion: reduce) {
